name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Git identity for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - run: dotnet build Whyso.sln
      - run: dotnet test Whyso.sln --no-build
